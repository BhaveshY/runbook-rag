[project]
name = "runbook-rag"
dynamic = ["version"]
description = "Kubernetes troubleshooting answers that quote the official docs, with a reproducible RAG evaluation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bhavesh Yeole" }]
keywords = ["rag", "retrieval", "bm25", "reranking", "kubernetes", "llm", "evaluation"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "fastembed>=0.9,<1",
]

[project.urls]
Repository = "https://github.com/BhaveshY/runbook-rag"

[project.scripts]
runbook = "runbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "runbook/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["runbook"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "runbook/resources/web"
"eval/cases.json" = "runbook/resources/eval/cases.json"
"data/sources.json" = "runbook/resources/data/sources.json"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
