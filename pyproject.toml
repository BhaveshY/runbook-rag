[project]
name = "runbook-rag"
version = "0.1.0"
description = "Evidence-first Kubernetes troubleshooting with reproducible retrieval evaluation."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "numpy>=2,<3", "pydantic>=2.10,<3", "pyyaml>=6,<7",
]

[project.scripts]
runbook = "runbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runbook"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "runbook/resources/web"
"eval/cases.json" = "runbook/resources/eval/cases.json"
"data/sources.json" = "runbook/resources/data/sources.json"
